name: Build Android Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps || npm install

      - name: Build Web Assets
        run: |
          npm run build || npx vite build || true
          mkdir -p dist
          touch dist/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Add Android & Build Signed AAB
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps || true
          npx cap init "Hekawy" "com.hekawy.app" --web-dir dist || true
          npx cap add android
          npx cap sync android

          cd android
          keytool -genkey -v -keystore release.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass mypassword123 -keypass mypassword123 -dname "CN=App, OU=Dev, O=Company, L=City, S=State, C=EG"
          chmod +x gradlew
          ./gradlew bundleRelease
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass mypassword123 -keypass mypassword123 app/build/outputs/bundle/release/*.aab my-key-alias

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-google-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
